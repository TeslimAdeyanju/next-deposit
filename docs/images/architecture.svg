<path d="M475 453V422"/><path d="M1130 453V422"/>
</g>
<text x="364" y="490" font-size="20" font-weight="700">Stays on your machine, never committed</text>
<g font-size="17">
<text x="364" y="522">Daily snapshots (CSV): history the API can't provide; feeds trends and risk</text>
<text x="364" y="548">portfolio_config.json: your target weights and monthly deposit, edited on the Planner</text>
</g>
<text x="1330" y="500" font-size="17" fill="#5b6773">--demo: fictional</text>
<text x="1330" y="524" font-size="17" fill="#5b6773">portfolio, no key,</text>
<text x="1330" y="548" font-size="17" fill="#5b6773">used for screenshots</text>
</g>
</svg>

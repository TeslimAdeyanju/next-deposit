<text x="60" y="200">Trading 212 Public</text><text x="60" y="222">API (read-only)</text>
<text x="60" y="256">Account summary</text><text x="60" y="278">Positions, pies</text><text x="60" y="300">Instruments</text>
<text x="60" y="322">Orders, dividends,</text><text x="60" y="344">transactions</text>

<text x="320" y="214">Trading212Client</text>
<text x="320" y="248">Live thread: 30s</text><text x="320" y="270">History thread:</text><text x="320" y="292">all pages, 30 min</text>
<text x="320" y="326">Rate-limit aware</text><text x="320" y="348">pagination</text>


<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">Trading 212 portfolio monitor: six-stage architecture</title>
<desc id="desc">Data flows from the Trading 212 Public API through ingestion threads, transformation in PortfolioAnalytics, analytics in insights.py, reporting state and daily snapshots, to a five-page terminal interface. Cross-cutting controls: rate-limit handling, last-good-data fallback, credentials kept out of git, and a demo data mode.</desc>

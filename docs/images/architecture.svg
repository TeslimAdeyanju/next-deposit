<rect x="40" y="420" width="1520" height="110" rx="10" fill="#fff8e6" stroke="#e6c96a" stroke-width="2"/>
<text x="64" y="456" font-size="20" font-weight="700">Cross-cutting controls</text>
<g font-size="18">
<text x="64" y="492">• Rate limits: per-endpoint pacing, retries off the UI thread</text>
<text x="64" y="518">• Failures keep the last good data and show the reason</text>
<text x="820" y="492">• Credentials in .env, never committed; read-only API key</text>
<text x="820" y="518">• Demo mode: fictional portfolio for screenshots and review</text>
</g>
</g>
</svg>

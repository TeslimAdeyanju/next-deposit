<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
<title id="title">How Next Deposit works</title>
<desc id="desc">The broker's public API feeds two background threads: a live feed every 30 seconds and a full-history feed every 30 minutes. A portfolio model builds the app-style holdings view and a look-through positions view. insights.py turns these into answers to four questions: where the next deposit should go, whether the investing is working, how diversified it really is, and what it earns and costs. A five-page terminal interface presents them. Daily snapshots and investor targets are kept on the user's machine only.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b6773"/></marker>
</defs>
<rect width="1600" height="600" fill="#ffffff"/>
<path d="M0 0H1600V600H0Z" fill="none" stroke="#cbd5df" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#20252b">
<text x="40" y="52" font-size="30" font-weight="700">How Next Deposit works</text>

<!-- boxes -->
<g stroke="#cbd5df" stroke-width="2">
<rect x="40" y="90" width="250" height="330" rx="10" fill="#f3f6f8"/>
<rect x="340" y="90" width="270" height="330" rx="10" fill="#f3f6f8"/>
<rect x="660" y="90" width="270" height="330" rx="10" fill="#f3f6f8"/>
<rect x="980" y="90" width="300" height="330" rx="10" fill="#e8f1fb"/>
<rect x="1330" y="90" width="230" height="330" rx="10" fill="#f3f6f8"/>
</g>
<g stroke="#5b6773" stroke-width="3" marker-end="url(#arrow)">
<path d="M292 255H336"/><path d="M612 255H656"/><path d="M932 255H976"/><path d="M1282 255H1326"/>
</g>

<g font-size="22" font-weight="700">
<text x="60" y="128">Broker</text><text x="60" y="154">public API</text>
<text x="360" y="128">Data feed</text><text x="360" y="154">(background threads)</text>
<text x="680" y="128">Portfolio model</text>
<text x="1000" y="128">insights.py</text><text x="1000" y="154">four questions</text>
<text x="1350" y="128">Terminal UI</text>
</g>
<g font-size="17">
<text x="60" y="196">Read-only API key</text>
<text x="60" y="232">Account summary</text>
<text x="60" y="256">Positions and pies</text>
<text x="60" y="280">Instrument metadata</text>
<text x="60" y="304">Orders, dividends,</text>
<text x="60" y="328">deposits/withdrawals</text>
<text x="60" y="372" fill="#8a4b00">No price history:</text>
<text x="60" y="396" fill="#8a4b00">the API can't give trends</text>

<text x="360" y="196">Live feed every 30s</text>
<text x="360" y="232">History feed every 30 min:</text>
<text x="360" y="256">every page of orders,</text>
<text x="360" y="280">dividends, transactions</text>
<text x="360" y="316">Waits out rate limits;</text>
<text x="360" y="340">keeps last good data</text>
<text x="360" y="376">The screen never waits</text>
<text x="360" y="400">on the network</text>

<text x="680" y="172"><tspan font-weight="700">Holdings</tspan>: like the app,</text>
<text x="680" y="196">pie shown as one line</text>
<text x="680" y="232"><tspan font-weight="700">Look-through</tspan>: every</text>
<text x="680" y="256">stock, including inside the pie</text>
<text x="680" y="292">£ values include FX;</text>
<text x="680" y="316">prices in $, €, p</text>
<text x="680" y="352">GBX (pence) counted</text>
<text x="680" y="376">as GBP exposure</text>

<text x="1000" y="190">1. Where should my next</text>
<text x="1000" y="212">    deposit go?  <tspan fill="#5b6773">planner, impact</tspan></text>
<text x="1000" y="250">2. Is my investing working?</text>
<text x="1000" y="272">    <tspan fill="#5b6773">XIRR, money in vs growth</tspan></text>
<text x="1000" y="310">3. Am I really diversified?</text>
<text x="1000" y="332">    <tspan fill="#5b6773">overlap, effective holdings</tspan></text>
<text x="1000" y="370">4. What does it earn and cost?</text>
<text x="1000" y="392">    <tspan fill="#5b6773">dividends, fees, ISA</tspan></text>

<text x="1350" y="172">Full-screen,</text><text x="1350" y="196">updates in place</text>
<text x="1350" y="236">1 Overview</text><text x="1350" y="260">2 Planner</text><text x="1350" y="284">3 Performance</text>
<text x="1350" y="308">4 Income</text><text x="1350" y="332">5 Risk</text>
<text x="1350" y="372">Keyboard-driven;</text><text x="1350" y="396">never places orders</text>
</g>


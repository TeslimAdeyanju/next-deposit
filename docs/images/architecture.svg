<text x="60" y="152">Data sourcing</text>
<text x="320" y="152">Ingestion</text>
<text x="580" y="152">Cleaning &amp;</text><text x="580" y="178">transformation</text>
<text x="840" y="152">Modelling &amp;</text><text x="840" y="178">analytics</text>
<text x="1100" y="152">Preparation</text><text x="1100" y="178">for reporting</text>
<text x="1360" y="152">Visualisation</text><text x="1360" y="178">&amp; insights</text>
